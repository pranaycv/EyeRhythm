# Build a self-contained Windows app (no Python on the recipient's PC).
# Download the zip from the Actions run and send that file.
#
# Trigger: Actions → "Build Windows app" → Run workflow
# Also runs when you push a tag like v1.0.0 (attaches files to the GitHub Release).

name: Build Windows app

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Freeze EyeRhythm.exe
        run: python -m PyInstaller --noconfirm --clean EyeRhythm.spec

      - name: Check freeze output
        shell: pwsh
        run: |
          $exe = "dist\EyeRhythm\EyeRhythm.exe"
          if (-not (Test-Path $exe)) {
            throw "PyInstaller did not produce $exe"
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Add start notes next to the exe
        shell: cmd
        run: |
          copy /Y for_windows\START_HERE.txt dist\EyeRhythm\START_HERE.txt
          copy /Y for_windows\Unblock-and-run.bat dist\EyeRhythm\Unblock-and-run.bat

      - name: Zip portable app
        shell: pwsh
        run: |
          Compress-Archive -Path dist\EyeRhythm -DestinationPath EyeRhythm-Windows.zip -Force
          Get-Item EyeRhythm-Windows.zip | Format-List FullName, Length

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: EyeRhythm-Windows-zip
          path: EyeRhythm-Windows.zip
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc "for_windows\for_developers\EyeRhythm.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EyeRhythm-Windows-setup
          path: for_windows/for_developers/Output/EyeRhythm-Setup.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EyeRhythm-Windows.zip
            for_windows/for_developers/Output/EyeRhythm-Setup.exe
          generate_release_notes: true
